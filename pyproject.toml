[project]
name = "foodaccess"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "python-calamine>=0.2",
    "flask>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
